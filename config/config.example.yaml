schema_version: 1

default_provider: openai

providers:
  openai:
    api_provider: openai-compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-5.4
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true
    wire_api: responses
    store: false

  anthropic:
    api_provider: anthropic-compatible
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-6
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true
    anthropic_version: 2023-06-01
    prompt_cache: true

  google:
    api_provider: google
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com
    model: gemini-2.5-flash
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true

  openai-compatible:
    api_provider: openai-compatible
    api_key_env: OPENAI_API_KEY
    base_url: http://localhost:3000/v1
    model: gpt-5.4
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true
    wire_api: responses
    store: false
    # send_metadata: false

# Role overrides are optional. Blank fields inherit the selected profile.
role_providers:
  planner:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""
  generator:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""
  evaluator:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""
  explorer:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""

web:
  # Optional. Both fields are required. Store a bcrypt hash, never plaintext.
  # basic_auth:
  #   username: operator
  #   password_hash: "$2a$..."
  # Host names besides localhost, *.localhost and IP literals need listing.
  # allowed_hosts:
  #   - agent.example.internal

session:
  dir: .aegis-agent/sessions
  dir_mode: "0700"

skills:
  dirs:
    - ./skills

runtime:
  exec_finish_required: true
  # yolo keeps non-essential reminders optional; tool safety still applies.
  guardrails_mode: yolo
  max_turns_soft: 24
  max_turns_hard: -1
  command_timeout_sec: 300
  provider_auto_resume:
    enabled: true
    max_attempts: 2
  steer:
    poll_interval_ms: 250
    default_behavior: queue
  exec_policy:
    # warn, deny or off
    mode: warn
  shell_env_allowlist:
    - PATH
    - HOME
    - LANG
    - TERM
  compact:
    # Zero derives the threshold from provider/model context information.
    input_char_threshold: 0
    keep_recent_tool_results: 3
    keep_recent_tool_result_bytes: 65536
    hysteresis_delta_chars: 0
    keep_recent_messages: 0
    utilization_factor: 0.85
    semantic_summary:
      enabled: true
      max_input_chars: 200000
      timeout_sec: 60
  tool_output:
    llm_output_max_bytes: 32768
    display_output_max_bytes: 131072
    artifact_file_max_bytes: 16777216
    artifact_session_max_bytes: 134217728
    artifact_max_files: 256
  multi_agent:
    enabled: true
    max_depth: 1
    max_active_children: 4
    cancel_grace_sec: 5
  isolation:
    default_mode: off
    # Keep isolation outside the source workspace.
    root_dir: ~/.aegis-agent/_worktrees
  queue:
    poll_interval_ms: 1000
    auto_worker: true
    reaper_interval_ms: 60000
    lease_stale_after_sec: 900
    background_wait_timeout_sec: 0
  child_budget:
    max_active_runtime_sec: 0
    max_elapsed_sec: 0
    max_turns_per_attempt: 0
    active_runtime_checkpoint_ms: 1000
  ephemeral:
    enabled: true
    artifact_dir: .artifacts/tool-outputs
  degeneration:
    enabled: true
    reminder_after: 2
    give_up_after: 4
    detect_low_quality: false
  ralph_loop:
    enabled: false
    max_iterations: 5
  pre_completion:
    enabled: true
    check_features: true

output:
  format: text
  show_raw_events: false

hooks:
  default_timeout_sec: 300

# Browser tools are optional, local and default-off. Install separately first.
tools:
  browser:
    enabled: false
    timeout_sec: 0
