schema_version: 1

default_provider: openai

providers:
  openai:
    api_provider: openai-compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-5.4
    # Optional. If omitted, go-cli-agent uses a known-model table or the
    # 200000-token default to derive compaction thresholds.
    # context_window_tokens: 200000
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true
    wire_api: responses
    max_output_tokens: 8192
    reasoning_effort: xhigh
    reasoning_summary: auto
    text_verbosity: low
    store: false
    # Diagnostic only: when true, writes provider-raw/<turn>.json sidecars.
    # raw_sidecar: false

  anthropic:
    api_provider: anthropic-compatible
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-6
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true
    anthropic_version: 2023-06-01
    prompt_cache: true
    # WebConsole Settings can also select max, which persists:
    # thinking_budget: 32000
    # include_thoughts: true
    # max_output_tokens: 32768

  google:
    api_provider: google
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com
    model: gemini-2.5-flash
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true

  openai-compatible:
    api_provider: openai-compatible
    api_key_env: OPENAI_API_KEY
    base_url: http://localhost:3000/v1
    model: gpt-5.4
    request_timeout_sec: 300
    stream_idle_timeout_ms: 300000
    retry:
      max_attempts: 5
      base_delay_ms: 1000
      retry_5xx: true
      retry_transport: true
    wire_api: responses
    reasoning_effort: xhigh
    reasoning_summary: auto
    store: false

  # Example custom provider profile that uses the Anthropic-compatible Messages adapter.
  # kimi:
  #   api_provider: anthropic-compatible
  #   api_key_env: KIMI_API_KEY
  #   base_url: https://<kimi-anthropic-compatible-endpoint>
  #   model: <kimi-model>
  #   anthropic_version: 2023-06-01
  #   thinking_budget: 32000
  #   include_thoughts: true
  #   max_output_tokens: 32768

# Optional role-level defaults for model-led delegation.
# Every field may stay blank. Blank provider inherits the default provider or
# parent session; blank api_provider/base_url/model inherits the selected
# provider profile. Explicit provider/model arguments still win.
role_providers:
  planner:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""
  generator:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""
  evaluator:
    provider: ""
    api_provider: ""
    base_url: ""
    model: ""

# Optional WebConsole HTTP Basic authentication. Both fields must be set to
# enable it. Generate a bcrypt hash outside this file; never save a clear-text
# password here. Basic Auth needs HTTPS when the console is exposed over an
# untrusted network.
# web:
#   basic_auth:
#     username: operator
#     password_hash: "$2a$..."

session:
  dir: .go-cli-agent/sessions
  dir_mode: "0700"

skills:
  dirs:
    - ./skills

runtime:
  exec_finish_required: true
  # standard: keep conservative delivery-consistency checks and collaboration reminders
  # yolo: disable non-essential runtime reminders/checks and let the model self-manage within tool-enforced boundaries
  guardrails_mode: yolo
  # Global per-run checkpoint; writes one reminder and never stops execution.
  max_turns_soft: 24
  # Global per-run hard guard for root, foreground child, and queue child.
  # -1 disables the hard turn budget.
  max_turns_hard: -1
  command_timeout_sec: 300
  provider_auto_resume:
    enabled: true
    max_attempts: 2
  exec_policy:
    # warn: attach shell policy violations to tool metadata without blocking
    # deny: block matching shell commands
    # off: disable this lightweight command classifier
    mode: warn
  steer:
    poll_interval_ms: 250
    default_behavior: queue
  shell_env_allowlist:
    - PATH
    - HOME
    - LANG
    - TERM
  compact:
    # 0 means derive from provider context_window_tokens / known-model / default.
    input_char_threshold: 0
    keep_recent_tool_results: 3
    # 0 means derive from input_char_threshold / 4.
    hysteresis_delta_chars: 0
    # 0 means derive proportionally from input_char_threshold.
    keep_recent_messages: 0
    utilization_factor: 0.85
    semantic_summary:
      enabled: true
      max_input_chars: 200000
      timeout_sec: 60
    # Optional overrides keyed by provider/model, model, or provider.
    # context_profiles:
    #   openai/gpt-5.4:
    #     input_char_threshold: 240000
  tool_output:
    llm_output_max_bytes: 32768
    display_output_max_bytes: 131072
    artifact_file_max_bytes: 16777216
    artifact_session_max_bytes: 134217728
    artifact_max_files: 256

  # 以下字段服务 advanced / extension profile，不是 Web-first v1 默认页面主路径。
  # multi_agent 默认开启只是暴露 child-agent 工具，是否真正派生 child 仍由当前 master agent 自主决定。
  multi_agent:
    enabled: true
    # v1 supports root -> child only; nested child spawning remains disabled.
    max_depth: 1
    # Shared active cap for foreground and background child work.
    max_active_children: 4
    # Cooperative cancellation grace before agent_stop returns a durable
    # cancel-requested result to the parent.
    cancel_grace_sec: 5
  isolation:
    default_mode: off
    # Must live outside the source workspace to avoid recursive copy/worktree targets.
    root_dir: ~/.go-cli-agent/_worktrees
  queue:
    poll_interval_ms: 1000
    auto_worker: true
    # Background queue liveness recovery. The reaper reclaims jobs whose owning
    # worker process has died (e.g. after a service restart) or whose lease
    # heartbeat has gone stale, so a parent never waits forever on a child whose
    # worker is gone. reaper_interval_ms <= 0 disables the sweep.
    reaper_interval_ms: 60000
    lease_stale_after_sec: 900
    # Upper bound on how long a parked parent waits for background child results
    # before recording a wait-timeout and returning to awaiting_input. 0 disables
    # the timeout (deadlock detection still wakes the parent on stalled work).
    background_wait_timeout_sec: 0
  # Optional limits for child / background (delegated) sessions. Root master
  # sessions are not limited here; all three dimensions default to 0 (Off).
  # Active runtime excludes paused/offline time. Absolute elapsed time starts
  # when the child/job is created and includes queueing and pauses. Turns are
  # counted per budget attempt; only an explicit parent budget extension starts
  # the next attempt. active_runtime_checkpoint_ms bounds live telemetry lag and
  # the single conservative charge for a crash-open interval; it does not count
  # offline wall time. Settings changes affect newly created child/job work only.
  child_budget:
    max_active_runtime_sec: 0
    max_elapsed_sec: 0
    max_turns_per_attempt: 0
    active_runtime_checkpoint_ms: 1000

output:
  format: text
  show_raw_events: false

hooks:
  default_timeout_sec: 300
