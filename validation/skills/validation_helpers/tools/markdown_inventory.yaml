name: markdown_inventory
description: List Markdown files in the current workspace for validation tasks
command:
  - /bin/sh
  - -lc
  - >-
    rg --files
    -g '*.md'
    -g '!validation/runs/**'
    -g '!validation/sessions/**'
    -g '!tmp/**'
    -g '!reports/**'
    -g '!outputs/**'
    -g '!.pytest_cache/**'
    .
    | sed -n '1,{{if .limit}}{{.limit}}{{else}}120{{end}}p'
timeout_sec: 30
input_schema:
  type: object
  properties:
    limit:
      type: integer
      description: Optional maximum number of paths to inspect
  additionalProperties: false
